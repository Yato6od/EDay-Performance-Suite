; MELLY Gears of War: E-Day - LOW / 1720x1440
; Performance profile. No smoke-removal / see-through-smoke commands.

[ScalabilityGroups]
sg.ResolutionQuality=100.000000
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0
sg.LandscapeQuality=0
sg.VolumetricFogQuality=1
sg.VolumetricCloudQuality=0
sg.HairQuality=0
sg.NaniteQuality=0
sg.RayTracingQuality=0
sg.RayTracingReflectionsQuality=0
sg.RayTracingShadowsQuality=0
sg.RayTracingGlobalIlluminationQuality=0

[AntiAliasingQuality@0]
r.PostProcessAAQuality=2

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.4

[ShadowQuality@0]
r.ShadowQuality=0
r.Shadow.DistanceScale=0.3
r.ContactShadows=0
r.DistanceFieldShadowing=0
r.Shadow.Virtual.Enable=0

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
r.Lumen.HardwareRayTracing=0
r.Lumen.DiffuseIndirect.Allow=0

[ReflectionQuality@0]
r.ReflectionMethod=0
r.SSR.Quality=0
r.Lumen.Reflections.Allow=0
r.Lumen.Reflections.HardwareRayTracing=0

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0

[TextureQuality@0]
r.MipMapLODBias=1.0
r.MaxAnisotropy=1

[EffectsQuality@0]
; Effects quality is Low, but smoke is not disabled.
fx.Niagara.QualityLevel=2

[FoliageQuality@0]
foliage.LODDistanceScale=0
foliage.DensityScale=0
grass.DensityScale=0
grass.CullDistanceScale=0

[ShadingQuality@0]
r.Nanite.MaxPixelsPerEdge=4

[LandscapeQuality@0]
r.StaticMeshLODDistanceScale=2.0

[VolumetricFogQuality@0]
; Intentionally no smoke-removal commands.

[VolumetricCloudQuality@0]
r.VolumetricCloud=0
r.VolumetricCloud.ShadowMap=0

[HairQuality@0]

[NaniteQuality@0]
r.Nanite.MaxPixelsPerEdge=4

[RayTracingQuality@0]
r.RayTracing=0
r.RayTracing.Enable=0

[RayTracingReflectionsQuality@0]
r.RayTracing.Reflections=0

[RayTracingShadowsQuality@0]
r.RayTracing.Shadows=0

[RayTracingGlobalIlluminationQuality@0]
r.RayTracing.GlobalIllumination=0

; Smoke-safe overrides: do not remove fog/translucency/particles.
[EffectsQuality@1]
fx.Niagara.QualityLevel=2

[VolumetricFogQuality@1]
r.Fog=1
r.VolumetricFog=1
r.SeparateTranslucency=1
r.TranslucencyVolumeBlur=1
